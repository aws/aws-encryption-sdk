# This workflow performs tests in Go.
name: Library Go tests

on:
  workflow_call:
    inputs:
      dafny:
        description: "The Dafny version to run"
        required: true
        type: string
      regenerate-code:
        description: "Regenerate code using smithy-dafny"
        required: false
        default: false
        type: boolean

jobs:
  testGo:
    strategy:
      fail-fast: false
      matrix:
        library: [AwsEncryptionSDK, TestVectors]
        go-version: ["1.24", "1.25"]
        os: [
            # Sed script doesn't work properly on windows
            # windows-latest,
            ubuntu-22.04,
            # TODO: Re-enable macOS after https://t.corp.amazon.com/P205755286
            # macos-15,
          ]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Support longpaths on Git checkout
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Init Submodules
        shell: bash
        run: |
          git submodule update --init libraries
          git submodule update --init --recursive mpl

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
          role-session-name: GoTests
          special-characters-workaround: "true" # Some environments (example: windowsOS) cannot tolerate special characters in a secret key.

      - name: Setup Dafny
        uses: ./mpl/.github/actions/setup_dafny
        with:
          dafny-version: ${{ inputs.dafny }}

      - name: Install Smithy-Dafny codegen dependencies
        uses: ./mpl/.github/actions/install_smithy_dafny_codegen_dependencies
        with:
          mpl-submodule-path: mpl/

      - name: Setup NASM for Windows (aws-lc-sys)
        if: matrix.os == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Compile ${{ matrix.library }} implementation
        shell: bash
        working-directory: ${{ matrix.library }}
        run: |
          # This works because `node` is installed by default on GHA runners
          CORES=$(node -e 'console.log(os.cpus().length)')
          make transpile_go CORES=$CORES

      - name: Unzip .NET Retry Flag Manifests
        shell: bash
        working-directory: TestVectors/dafny/TestVectors/test/
        run: |
          unzip invalid-Net-4.0.0.zip -d invalid-Net-4.0.0
          unzip v4-Net-4.0.1.zip -d v4-Net-4.0.1
          unzip valid-Net-4.0.0.zip -d valid-Net-4.0.0

      # TODO: Remove this after Go polymorph does not generate unwanted duplicate code.
      - name: Purge polymorph code in Go
        if: matrix.library == 'TestVectors'
        working-directory: ./${{ matrix.library }}
        shell: bash
        run: |
          make purge_polymorph_code

      # The test server dashboard merges this run's line coverage, line by
      # line, with the coverage the Go test server gives the same commit.
      - name: Turn on line coverage
        if: runner.os == 'Linux' && matrix.library == 'AwsEncryptionSDK' && matrix.go-version == '1.25' && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/local-coverage/gocover"
          echo "LOCAL_COVERAGE=esdk" >> "$GITHUB_ENV"

      - name: Test Go
        working-directory: ${{ matrix.library }}
        shell: bash
        run: |
          if [ -n "${LOCAL_COVERAGE:-}" ]; then
            # `go run TestsFromDafny.go` names its main package
            # command-line-arguments; a -cover binary whose main package is
            # not covered writes no counters.
            module=$(awk '/^module /{print $2}' runtimes/go/ImplementationFromDafny-go/go.mod)
            export GOFLAGS="-cover -coverpkg=$module/...,command-line-arguments"
            export GOCOVERDIR="$RUNNER_TEMP/local-coverage/gocover"
          fi
          make test_go

      # Paths are made relative to the repository so the two reports line up.
      - name: Write the line coverage report
        if: env.LOCAL_COVERAGE != ''
        shell: bash
        run: |
          python3 .github/scripts/coverage_lcov.py go \
            "$RUNNER_TEMP/local-coverage/gocover" "$RUNNER_TEMP/local-coverage/esdk-go.lcov" \
            --module-dir AwsEncryptionSDK/runtimes/go/ImplementationFromDafny-go \
            --keep AwsEncryptionSDK/runtimes/go/ImplementationFromDafny-go/

      - name: Upload the line coverage report
        if: env.LOCAL_COVERAGE != ''
        uses: actions/upload-artifact@v7
        with:
          name: local-coverage-esdk-go
          path: ${{ runner.temp }}/local-coverage/esdk-go.lcov
          if-no-files-found: warn

      - name: Test Examples for Go
        if: matrix.library == 'AwsEncryptionSDK'
        working-directory: ${{ matrix.library }}/runtimes/go/examples
        shell: bash
        run: |
          go run main.go
