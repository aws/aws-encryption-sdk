# This workflow performs static analysis checks.
name: static analysis

on: ["pull_request"]

permissions:
  contents: read

jobs:
  not-grep:
    runs-on: codebuild-CryptoToolsCI-linux-aws-encryption-sdk-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # not-grep 1.0.1 imports pkg_resources, which only older setuptools releases include.
      - name: not-grep
        run: |
          pip install not-grep==1.0.1 "setuptools<81"
          not-grep -c .github/not-grep.toml
