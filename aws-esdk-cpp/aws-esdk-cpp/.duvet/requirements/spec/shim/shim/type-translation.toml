target = "spec/shim/shim.md#type-translation"

# Type translation
#
# A shim converts each value between its target representation and the core
# library's representation. This generic specification does not enumerate concrete
# types; a core-library-specific shim specification defines a translation for
# each value it exposes. Every such translation MUST obey the following rules.
# 
# - A translation MUST convert between the target representation and the core
#   library representation, preserving meaning in both directions it supports.
# - A translation reports failure by returning an error; it MUST NOT panic, abort,
#   or otherwise terminate the target process.
# - When the target supplies a value that has no corresponding core-library
#   representation, the translation MUST return an error.
# - When the core library produces a value the shim does not define, the
#   translation MUST return an error.

[[spec]]
level = "MUST"
quote = '''
Every such translation MUST obey the following rules.
'''

