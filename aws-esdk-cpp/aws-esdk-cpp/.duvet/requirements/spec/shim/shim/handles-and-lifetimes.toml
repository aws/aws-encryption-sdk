target = "spec/shim/shim.md#handles-and-lifetimes"

# Handles and lifetimes
#
# - Before dereferencing a target-supplied resource handle, the shim MUST check it
#   and MUST return an error when a required handle is absent.
# - An owned interface that depends on another resource MUST retain ownership of
#   that resource for its own lifetime, so that a handle passed across the boundary
#   cannot outlive the resource it refers to.

[[spec]]
level = "MUST"
quote = '''
- Before dereferencing a target-supplied resource handle, the shim MUST check it
and MUST return an error when a required handle is absent.
'''

[[spec]]
level = "MUST"
quote = '''
- An owned interface that depends on another resource MUST retain ownership of
that resource for its own lifetime, so that a handle passed across the boundary
cannot outlive the resource it refers to.
'''

